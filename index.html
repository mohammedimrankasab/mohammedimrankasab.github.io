<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Kasab Mohammed Imran — Staff Backend Engineer specializing in Go, distributed systems, Kubernetes, cloud-native platforms, and AI."
    />

    <title>KASAB MOHAMMED IMRAN</title>

    <style>
      :root {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #e2e8f0;
        background: #020617;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 50% 35%,
            rgba(59, 130, 246, 0.12),
            transparent 32%
          ),
          #020617;
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .container {
        width: min(720px, 100%);
        text-align: center;
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(96, 165, 250, 0.25);
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.75);
        box-shadow: 0 0 40px rgba(59, 130, 246, 0.12);
        font-size: 2rem;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        color: #60a5fa;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -0.04em;
        background: linear-gradient(90deg, #e2e8f0, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .subtitle {
        margin: 1.25rem auto 0;
        max-width: 600px;
        font-size: 1rem;
        line-height: 1.7;
        color: #94a3b8;
      }

      .cheesy {
        margin: 2.5rem 0 0.5rem;
        font-size: 1.15rem;
        font-weight: 600;
        color: #cbd5e1;
      }

      .hint {
        margin: 0 0 1.75rem;
        color: #64748b;
        font-size: 0.9rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.85rem 1.5rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 999px;
        background: rgba(30, 41, 59, 0.8);
        color: #f8fafc;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 600;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          background 0.2s ease;
      }

      a:hover {
        transform: translateY(-2px);
        border-color: rgba(96, 165, 250, 0.5);
        background: rgba(51, 65, 85, 0.9);
      }

      footer {
        margin-top: 3rem;
        color: #475569;
        font-size: 0.75rem;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="container">
        <div class="icon" aria-hidden="true">⌘</div>

        <p class="eyebrow">Staff Backend Engineer</p>

        <h1>KASAB MOHAMMED IMRAN</h1>

        <p class="subtitle">
          Go · Distributed Systems · Kubernetes · Cloud Native · AI
        </p>

        <p class="cheesy">Well... you found the root. 👀</p>

        <p class="hint">The interesting stuff is one click away.</p>

        <a href="/portfolio/">
          Explore my portfolio
          <span aria-hidden="true">→</span>
        </a>

        <footer>Built with Go, Kubernetes, curiosity &amp; questionable jokes.</footer>
      </div>
    </main>
  </body>
</html>
